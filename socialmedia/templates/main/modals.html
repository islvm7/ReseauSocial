<!-- Registration Modal -->
<div class="modal" id="registerModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Create Account</h2>
            <span class="close-modal" data-modal="registerModal">&times;</span>
        </div>
        <div class="modal-body">
            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required>
                </div>
                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </div>
</div>

<!-- Profile Edit Modal -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Profile</h2>
            <span class="close-modal" data-modal="editModal">&times;</span>
        </div>
        <div class="modal-body">
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="editBio">Bio</label>
                    <textarea id="editBio" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="editLocation">Location</label>
                    <input type="text" id="editLocation">
                </div>
                <div class="form-group">
                    <label for="editProfileImg">Profile Image</label>
                    <input type="file" id="editProfileImg" accept="image/*">
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
