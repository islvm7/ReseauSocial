<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Social Media</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            padding: 40px;
            animation: slideIn 0.5s ease-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }

        .logo p {
            color: #666;
            margin-top: 5px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .profile-upload {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #667eea;
        }

        .upload-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            background: #764ba2;
        }

        #profileimg {
            display: none;
        }

        .error-messages {
            background: #fee;
            border-left: 4px solid #f44336;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #c62828;
            font-size: 14px;
        }

        .error-messages ul {
            list-style: none;
            margin: 0;
        }

        .error-messages li {
            margin-bottom: 5px;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { 
            width: 33%; 
            background: #f44336; 
        }
        
        .strength-medium { 
            width: 66%; 
            background: #ff9800; 
        }
        
        .strength-strong { 
            width: 100%; 
            background: #4caf50; 
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <h1>🚀 Social Media</h1>
            <p>Créez votre compte et rejoignez la communauté</p>
        </div>

        {% if messages %}
        <div class="error-messages">
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'socialmedia:signup' %}" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="profile-upload">
                <img src="/media/default.jpg" alt="Profile" class="profile-preview" id="preview">
                <div>
                    <label for="profileimg" class="upload-btn">Choisir une photo</label>
                    <input type="file" id="profileimg" name="profileimg" accept="image/*">
                    <p style="font-size: 12px; color: #999; margin-top: 5px;">JPG, PNG (max 5MB)</p>
                </div>
            </div>

            <div class="form-group">
                <label for="username">Nom d'utilisateur *</label>
                <input type="text" id="username" name="username" required 
                       placeholder="Choisissez un nom d'utilisateur"
                       value="{{ form.username.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required 
                       placeholder="votre@email.com"
                       value="{{ form.email.value|default:'' }}">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">Prénom</label>
                    <input type="text" id="first_name" name="first_name" 
                           placeholder="Prénom"
                           value="{{ form.first_name.value|default:'' }}">
                </div>

                <div class="form-group">
                    <label for="last_name">Nom</label>
                    <input type="text" id="last_name" name="last_name" 
                           placeholder="Nom"
                           value="{{ form.last_name.value|default:'' }}">
                </div>
            </div>

            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" 
                       placeholder="+213 XXX XXX XXX"
                       value="{{ form.telephone.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="date_naissance">Date de naissance</label>
                <input type="date" id="date_naissance" name="date_naissance"
                       value="{{ form.date_naissance.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="location">Localisation</label>
                <input type="text" id="location" name="location" 
                       placeholder="Ville, Pays"
                       value="{{ form.location.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="interet">Centres d'intérêt</label>
                <input type="text" id="interet" name="interet" 
                       placeholder="Sport, Musique, Voyage..."
                       value="{{ form.interet.value|default:'' }}">
            </div>

            <div class="form-group">
                <label for="bio">Biographie</label>
                <textarea id="bio" name="bio" 
                          placeholder="Parlez-nous un peu de vous...">{{ form.bio.value|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label for="password1">Mot de passe *</label>
                <input type="password" id="password1" name="password1" required 
                       placeholder="Créez un mot de passe sécurisé">
                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="password2">Confirmer le mot de passe *</label>
                <input type="password" id="password2" name="password2" required 
                       placeholder="Confirmez votre mot de passe">
            </div>

            <button type="submit" class="btn-signup">Créer mon compte</button>
        </form>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="login-link">
            Vous avez déjà un compte ? <a href="{% url 'socialmedia:login' %}">Se connecter</a>
        </div>
    </div>

    <script>
        // Prévisualisation de l'image
        document.getElementById('profileimg').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('preview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Vérification de la force du mot de passe
        const password1 = document.getElementById('password1');
        const strengthBar = document.getElementById('strengthBar');

        password1.addEventListener('input', function() {
            const value = this.value;
            let strength = 0;

            if (value.length >= 8) strength++;
            if (/[a-z]/.test(value) && /[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^a-zA-Z0-9]/.test(value)) strength++;

            strengthBar.className = 'password-strength-bar';
            
            if (strength <= 1) {
                strengthBar.classList.add('strength-weak');
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
            } else {
                strengthBar.classList.add('strength-strong');
            }
        });

        // Validation côté client
        const form = document.querySelector('form');
        const password2 = document.getElementById('password2');

        form.addEventListener('submit', function(e) {
            if (password1.value !== password2.value) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas !');
                password2.focus();
            }
        });
    </script>
</body>
</html>
